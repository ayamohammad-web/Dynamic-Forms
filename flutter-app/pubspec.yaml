name: field_teams
description: برنامج الفرق الفنية - Field Technical Teams Management App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Local storage (offline support)
  shared_preferences: ^2.3.2

  # Image picker (camera + gallery)
  image_picker: ^1.1.2

  # HTTP for API calls
  http: ^1.2.2

  # Date formatting + Arabic locale
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
